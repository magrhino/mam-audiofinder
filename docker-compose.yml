services:
  shelfarr:
    build:
      context: .
      dockerfile: build/Dockerfile
      target: production  # Use production stage, not testing
      args:
        PUID: ${PUID}
        PGID: ${PGID}
    image: ghcr.io/magrhino/shelfarr:latest
    container_name: shelfarr
    networks:
      - nginx-network # only had if you want to run on local network
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    user: "${PUID}:${PGID}"
    environment:
      UMASK: "${UMASK}"
      # Override DATA_DIR to use container path, not host path
      # (Host path is used by docker-compose for volume mount only)
      DATA_DIR: "/data"
    volumes:
      - ${DATA_DIR}:/data
      - ${MEDIA_ROOT}:/media
    restart: unless-stopped

networks:
   nginx-network:
      external: true
