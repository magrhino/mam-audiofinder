<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Audiobook Finder{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="ShelfArr" />
  <link rel="manifest" href="/static/site.webmanifest" />
  <meta name="theme-color" content="#8b2635">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <nav class="task-bar">
    <a href="/" class="nav-btn {% block nav_search %}{% endblock %}" title="Search for audiobooks">
      🔍 Search
    </a>
    <a href="/history" class="nav-btn {% block nav_history %}{% endblock %}" title="View download history and imports">
      📋 History
    </a>
    <a href="/showcase" class="nav-btn {% block nav_showcase %}{% endblock %}" title="Browse audiobooks in grid view">
      🎭 Showcase
    </a>
    <a href="/series" class="nav-btn {% block nav_series %}{% endblock %}" title="Discover book series">
      📚 Series
    </a>
    <a href="/logs" class="nav-btn {% block nav_logs %}{% endblock %}" title="View application logs">
      📄 Logs
    </a>
    <div class="task-bar-spacer"></div>
    <span id="navHealth" class="health-indicator" title="Application health status">
      <span class="health-dot"></span>
      <span class="health-text">Checking...</span>
    </span>
  </nav>

  {% block content %}
  <!-- Page-specific content goes here -->
  {% endblock %}

  <script type="module" src="{% block page_script %}/static/app.js?v=5{% endblock %}"></script>
</body>
</html>
