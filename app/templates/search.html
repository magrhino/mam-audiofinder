{% extends "base.html" %}

{% block title %}Search - Audiobook Finder{% endblock %}
{% block nav_search %}active{% endblock %}
{% block page_script %}/static/pages/search.js?v=5{% endblock %}

{% block content %}
  <div id="searchApp">
    <form class="row" @submit.prevent="runSearch">
      <input v-model="form.q" type="text" placeholder="Search title/author/narrator" />
      <select v-model="form.sort">
        <option value="default">Sort: Default</option>
        <option value="seedersDesc">Seeders ↓</option>
        <option value="dateDesc">Date Added ↓</option>
        <option value="sizeDesc">Size ↓</option>
      </select>
      <select v-model="form.perpage">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
      </select>
      <button type="submit">Search</button>
    </form>

    <div class="muted" v-text="status"></div>

    <table v-if="results.length">
      <thead>
        <tr>
          <th style="width: 80px">Cover</th>
          <th>Title</th>
          <th>Author</th>
          <th>Narrator</th>
          <th>Filetype</th>
          <th class="right">Size</th>
          <th class="right">Seeders</th>
          <th>Uploaded</th>
          <th class="center">Link</th>
          <th>Add</th>
        </tr>
      </thead>
      <tbody>
        <ResultRow v-for="row in results" :key="row.id + row.added" :item="row" @add="addTorrent" />
      </tbody>
    </table>
  </div>
{% endblock %}
