{% extends "base.html" %}

{% block title %}Series - Audiobook Finder{% endblock %}
{% block nav_series %}active{% endblock %}
{% block page_script %}/static/pages/series.js?v=5{% endblock %}

{% block content %}
  <div class="card">
    <div class="series-header">
      <h3>Series Discovery</h3>
      <div class="series-controls">
        <input id="seriesTitle" type="text" placeholder="Book title..." style="width: 250px">
        <input id="seriesAuthor" type="text" placeholder="Author (optional)" style="width: 200px">
        <select id="seriesLimit">
          <option value="5">5 results</option>
          <option value="10">10 results</option>
          <option value="20" selected>20 results</option>
          <option value="30">30 results</option>
          <option value="40">40 results</option>
          <option value="50">50 results</option>
        </select>
        <button id="seriesSearchBtn" class="primary">🔍 Search Series</button>
      </div>
    </div>
    <div id="seriesStatus" class="muted" style="margin: 1rem 0;"></div>

    <!-- Series search results table -->
    <div id="seriesTableContainer" style="display:none">
      <table id="seriesTable">
        <thead>
          <tr>
            <th>Series</th>
            <th>Author</th>
            <th class="center">Books</th>
            <th class="center">Readers</th>
            <th class="center">Action</th>
          </tr>
        </thead>
        <tbody id="seriesTableBody"></tbody>
      </table>
    </div>

    <!-- Book cards detail view -->
    <div id="seriesDetailContainer" style="display:none">
      <div id="seriesBreadcrumb" style="margin: 1rem 0;">
        <button id="backToSeriesTable" class="secondary">← Back to Series List</button>
      </div>
      <h3 id="seriesDetailTitle"></h3>
      <div id="seriesDetailGrid" class="showcase-grid"></div>
    </div>
  </div>

  <!-- Modal/Drawer for series search from cards -->
  <div id="seriesDrawer" class="series-drawer" style="display:none">
    <div class="series-drawer-content">
      <div class="series-drawer-header">
        <h3>Series Search</h3>
        <button id="closeSeriesDrawer" class="secondary">✕ Close</button>
      </div>
      <div id="seriesDrawerBody">
        <!-- Same content as main series tab -->
      </div>
    </div>
  </div>
{% endblock %}
